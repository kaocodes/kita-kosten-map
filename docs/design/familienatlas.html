;&lt;option&gt;Zwei zusammenlebende Eltern&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;Anzahl Kinder im Haushalt&lt;select disabled&gt;&lt;option&gt;2 Kinder&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;label&gt;Haushaltsbrutto pro Jahr&lt;select disabled&gt;&lt;option&gt;80.000 €&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;atlas-config-children&quot;&gt;&lt;span&gt;Kind 1 · Krippenkind · 8 Std./Tag&lt;/span&gt;&lt;span&gt;Kind 2 · Kindergartenkind · 8 Std./Tag&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;atlas-note&quot;&gt;Formularposition zur Ansicht. Dieser Entwurf wechselt zwischen zwei vorberechneten Modellkonfigurationen; ein frei bedienbarer Rechner folgt erst bei der Umsetzung.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;
